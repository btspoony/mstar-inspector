<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Morning Star — Platform operations</title>
    <script>
      // Same pre-paint theme bootstrap as the workspace shell: a stored manual
      // choice applies before first paint; nothing stored renders dark.
      try {
        const t = localStorage.getItem("mstar.dashboard.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <link rel="icon" type="image/png" href="./icon.png" />
    <!--SPA_BOOT-->
    <style>
      /* Console chrome only — the workspace shell's Layout is deliberately not
         reused, so this document carries its own minimal frame. Spacing and
         typography ride the same tokens the shipped primitives use
         (DESIGN.md: page gutter spacing-6, card padding spacing-6, the
         PageHeader heading-24 title face); colours stay on the existing vars. */
      body {
        font-family: "Geist Sans", system-ui, sans-serif;
      }
      .admin {
        max-width: 1100px;
        margin: 0 auto;
        padding: var(--spacing-6) var(--spacing-4);
      }
      .admin-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--spacing-4);
        border-bottom: 1px solid var(--gray-alpha-400);
        padding-bottom: var(--spacing-3);
      }
      .admin-header h1 {
        margin: 0;
        /* PageHeader heading-24 face (24/600/1.25/-0.01em). */
        font-size: var(--typo-heading-24-size);
        font-weight: var(--typo-heading-24-weight);
        line-height: var(--typo-heading-24-line);
        letter-spacing: var(--typo-heading-24-tracking);
      }
      .admin-nav {
        display: flex;
        gap: var(--spacing-1);
        margin: var(--spacing-4) 0 var(--spacing-6);
        flex-wrap: wrap;
      }
      .admin-nav a {
        color: var(--gray-800);
        text-decoration: none;
        padding: var(--spacing-2) var(--spacing-3);
        border-radius: var(--rounded-sm);
      }
      .admin-nav a[aria-current="page"] {
        background: var(--gray-alpha-200);
        color: var(--gray-1000);
      }
      .admin-main {
        border: 1px solid var(--gray-alpha-400);
        border-radius: var(--rounded-md);
        /* Card default padding (DESIGN.md Spacing & Layout). */
        padding: var(--spacing-6);
      }
      .muted {
        color: var(--gray-700);
        font-size: var(--typo-copy-14-size);
        line-height: var(--typo-copy-14-line);
        margin: var(--spacing-1) 0 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./admin/main.tsx"></script>
  </body>
</html>
