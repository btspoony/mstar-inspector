<!doctype html>
<!--
  The console is the D15 plain variant. `data-surface="ops"` sits on the
  document root — not a page wrapper — so the generated re-map in tokens.css
  reaches everything Radix portals mount on <body>: the flag-confirm dialog,
  dropdowns, tooltips. The accent tone is withheld whole there; no page in
  src/spa/admin/ forks a component to look plainer.
-->
<html lang="en" data-surface="ops">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Morning Star — Platform operations</title>
    <script>
      // Same pre-paint theme bootstrap as the workspace shell: a stored manual
      // choice applies before first paint; nothing stored renders dark.
      try {
        const t = localStorage.getItem("mstar.dashboard.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <link rel="icon" type="image/png" href="./icon.png" />
    <!--SPA_BOOT-->
    <style>
      /* Console chrome only — the workspace shell's Layout is deliberately not
         reused, so this document carries its own minimal frame. Every value
         here is a semantic token: spacing and typography ride the same steps
         the shipped primitives use (DESIGN.md: page gutter spacing-6, card
         padding spacing-6, the PageHeader heading-24 title face), colours are
         the semantic layer's, and the two hairlines plus the panel radius are
         the shared primitive's own utilities on the elements below — this file
         spells no width, radius or colour of its own. */
      body {
        font-family: var(--font-sans);
      }
      .admin {
        max-width: 1100px;
        margin: 0 auto;
        padding: var(--spacing-6) var(--spacing-4);
      }
      .admin-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--spacing-4);
        padding-bottom: var(--spacing-3);
      }
      .admin-header h1 {
        margin: 0;
        /* PageHeader heading-24 face (24/600/1.25/-0.01em). */
        font-size: var(--typo-heading-24-size);
        font-weight: var(--typo-heading-24-weight);
        line-height: var(--typo-heading-24-line);
        letter-spacing: var(--typo-heading-24-tracking);
      }
      .admin-nav {
        display: flex;
        gap: var(--spacing-1);
        margin: var(--spacing-4) 0 var(--spacing-6);
        flex-wrap: wrap;
      }
      .admin-nav a {
        color: var(--text-secondary);
        text-decoration: none;
        padding: var(--spacing-2) var(--spacing-3);
        border-radius: var(--radius-control);
      }
      .admin-nav a[aria-current="page"] {
        /* The chrome's own active tint (DESIGN.md Sidebar / console chrome):
           the neutral overlay plane, never the accent. */
        background: var(--surface-overlay);
        color: var(--text-primary);
      }
      .admin-main {
        /* Card default padding (DESIGN.md Spacing & Layout). */
        padding: var(--spacing-6);
      }
      .muted {
        color: var(--text-muted);
        font-size: var(--typo-copy-14-size);
        line-height: var(--typo-copy-14-line);
        margin: var(--spacing-1) 0 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./admin/main.tsx"></script>
  </body>
</html>
