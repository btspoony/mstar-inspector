# omp agent models.yml provisioned inside the review-runner image (plan 06 T2).
#
# Declares the ark-plan provider (M0 provider=ark hypothesis, verified live in
# the T2 falsification: real SDK + real key → structured review, 4 findings).
# `apiKey: ARK_API_KEY` is the ENV VAR NAME — the SDK resolves the value from
# the process environment at request time (config-value resolution: env first,
# literal fallback). NO secret material lives in this file or the image
# (zero-secrets constraint); the key is injected only via exec env at runtime.
#
# The SDK reads models.yml from $PI_CODING_AGENT_DIR/models.yml (default
# ~/.omp/agent/models.yml). The Dockerfile sets PI_CODING_AGENT_DIR=/opt/omp-agent
# and installs this file there.

providers:
  ark-plan:
    baseUrl: https://ark.cn-beijing.volces.com/api/plan
    apiKey: ARK_API_KEY
    api: anthropic-messages
    auth: apiKey
    models:
      - id: deepseek-v4-flash
        name: Deepseek v4 flash 0731
        reasoning: true
        input: [text]
        contextWindow: 1024000
        maxTokens: 65536
