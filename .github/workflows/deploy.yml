name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '.mstar/**', '*.md', 'LICENSE']
  workflow_dispatch: {}

concurrency:
  group: deploy-mstar-inspector
  cancel-in-progress: false

jobs:
  test:
    permissions: { contents: read }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  deploy:
    needs: test
    permissions: { contents: write }
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
      GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}
      DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
      DASHBOARD_ENCRYPTION_KEY: ${{ secrets.DASHBOARD_ENCRYPTION_KEY }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Cloudflare account
        run: |
          test -n "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"   # repo var must declare the deploy account
          test "$CLOUDFLARE_ACCOUNT_ID" = "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"   # stale env 即 trap
          bunx wrangler whoami    # token/账户名佐证，输出进 run log

      - name: Write required secrets
        run: |
          : "${GITHUB_OAUTH_CLIENT_ID:?required}" "${GITHUB_OAUTH_CLIENT_SECRET:?required}" \
            "${DASHBOARD_SESSION_SECRET:?required}" "${DASHBOARD_ENCRYPTION_KEY:?required}"
          jq -n '{GITHUB_OAUTH_CLIENT_ID: env.GITHUB_OAUTH_CLIENT_ID,
                  GITHUB_OAUTH_CLIENT_SECRET: env.GITHUB_OAUTH_CLIENT_SECRET,
                  DASHBOARD_SESSION_SECRET: env.DASHBOARD_SESSION_SECRET,
                  DASHBOARD_ENCRYPTION_KEY: env.DASHBOARD_ENCRYPTION_KEY}' \
            | bunx wrangler secret bulk

      - name: Write optional ALERT_WEBHOOK_URL secret
        if: env.ALERT_WEBHOOK_URL != ''
        run: "jq -n '{ALERT_WEBHOOK_URL: env.ALERT_WEBHOOK_URL}' | bunx wrangler secret bulk"

      # (T3) D1 迁移 --remote + wrangler deploy + post-deploy smoke（healthz / cron / digest 提取）
      # (T4) digest 写回 docs/deploy.md（git commit + push；paths-ignore 防递归）
