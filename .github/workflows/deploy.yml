name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '.mstar/**', '*.md', 'LICENSE', '.env.example']
  workflow_dispatch:
    inputs:
      tenant_mode:
        description: 'Workspace tenant read mode (off | strict)'
        required: false
        default: 'off'
        type: choice
        options:
          - 'off'
          - 'strict'
      expected_deploy_sha:
        description: "Deploy B (strict) only: the SHA Deploy A shipped — required for a strict replay; Deploy A's run summary prints deployed_sha=<sha>"
        required: false
        default: ''
      expected_container_digest:
        description: "Deploy B only: Deploy A's sandbox image digest (sha256:…) — compared and reported, never assumed identical"
        required: false
        default: ''

concurrency:
  group: deploy-mstar-inspector
  cancel-in-progress: false

jobs:
  test:
    permissions: { contents: read }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions: { contents: read }   # no git push / API writes — digest recorded in run summary + artifacts
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}   # account id is public — configured as a variable
      ADMIN_LOGINS: ${{ vars.ADMIN_LOGINS }}   # login names are public identity — configured as a variable, not a secret
      OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}   # client id is not sensitive — configured as a variable
      OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
      DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
      DASHBOARD_ENCRYPTION_KEY: ${{ secrets.DASHBOARD_ENCRYPTION_KEY }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Bugbot #14: digest write-back merges origin/main — shallow clone has no merge base

      # The mode is a dispatch input, never a code edit: the SAME build is
      # deployed twice on the tenant rollout (off, then strict). A `push` run
      # carries no input → off. An illegal value fails HERE, before any step
      # that can create or deploy a Worker version.
      - name: Resolve tenant mode
        id: tenant
        env:
          TENANT_MODE: ${{ inputs.tenant_mode }}
        run: |
          MODE="${TENANT_MODE:-off}"
          case "$MODE" in
            off|strict) ;;
            *)
              echo "::error::invalid tenant_mode '$MODE' — expected off or strict"
              exit 1
              ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "tenant_mode=$MODE"

      # Replay identity (before anything is deployed). The strict binding lives
      # in scripts/deploy-replay-guard.sh (executed by the behaviour tests); the
      # checkout assertion below stays here because it is about the tree on
      # disk, not about which SHA was requested.
      - name: Assert replay identity
        env:
          MODE: ${{ steps.tenant.outputs.mode }}
          RUN_SHA: ${{ github.sha }}
          EXPECTED_DEPLOY_SHA: ${{ inputs.expected_deploy_sha }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "$RUN_SHA" ]; then
            echo "::error::checked-out HEAD $HEAD_SHA != run SHA $RUN_SHA — the replay must execute the SHA it names"
            exit 1
          fi
          bash scripts/deploy-replay-guard.sh "$MODE" "$EXPECTED_DEPLOY_SHA" "$RUN_SHA" "$HEAD_SHA"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SPA
        run: bun run build:spa

      # Runs before the FIRST wrangler invocation of any kind (`whoami` below,
      # then every `wrangler secret bulk` and the final `wrangler deploy`): the
      # secret write creates and deploys a Worker version, so a gate placed
      # after it would already have published a version without the required
      # binding — "fail before deploy" has to mean before the first one.
      - name: Verify required ADMIN_LOGINS variable
        run: |
          # The RUNTIME rule itself, imported (src/dashboard/users.ts
          # parseAdminLogins) — not a shell approximation of it: split on
          # commas, JS String.trim() each entry, drop empties. Unset / blank /
          # whitespace-only / comma-only / U+FEFF+"," all parse to zero logins
          # and must fail closed BEFORE any deploy-capable step.
          : "${ADMIN_LOGINS:?required — set the GitHub Actions variable ADMIN_LOGINS to a comma-separated list of GitHub logins (login names are public identity, so a variable, not a secret)}"
          bun -e '
            import { parseAdminLogins } from "./src/dashboard/users.ts";
            if (parseAdminLogins(process.env.ADMIN_LOGINS).length === 0) {
              console.error("::error::ADMIN_LOGINS is blank, whitespace-only or comma-only — set the GitHub Actions variable ADMIN_LOGINS to a comma-separated list of GitHub logins (e.g. alice,bob)");
              process.exit(1);
            }
          '

      - name: Verify Cloudflare account
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"   # account id is a variable — must be configured
          bunx wrangler whoami    # token/账户名佐证，输出进 run log（人工核对账户）

      # D1 work runs BEFORE the first `wrangler secret bulk`: that command
      # creates and deploys a Worker version, so the migration + the abort gate
      # must already be satisfied (they need only the API token, not the
      # dashboard secrets).
      - name: Apply D1 migrations (remote)
        run: bunx wrangler d1 migrations apply mstar-inspector-db --remote

      # 0027 is idempotent (INSERT…SELECT … WHERE NOT EXISTS): re-running it is
      # the repair step for a partially-applied deploy. The gate below proves
      # the repair actually closed every gap.
      - name: Re-run workspace backfill (0027, idempotent)
        run: bunx wrangler d1 execute mstar-inspector-db --remote --file migrations/0027_workspace_backfill.sql

      # ABORT GATE (both modes): `strict` App reads INNER JOIN app_workspaces,
      # so an unmapped App silently vanishes from the pipeline. Ordered before
      # EVERY deploy-capable step — `wrangler secret bulk` publishes a version
      # just as `wrangler deploy` does.
      - name: Assert zero orphan Apps (pre-deploy gate)
        run: bun scripts/assert-tenant-attribution.ts --db mstar-inspector-db

      - name: Write required secrets
        run: |
          : "${OAUTH_CLIENT_ID:?required}" "${OAUTH_CLIENT_SECRET:?required}" \
            "${DASHBOARD_SESSION_SECRET:?required}" "${DASHBOARD_ENCRYPTION_KEY:?required}"
          jq -n '{GITHUB_OAUTH_CLIENT_ID: env.OAUTH_CLIENT_ID,
                  GITHUB_OAUTH_CLIENT_SECRET: env.OAUTH_CLIENT_SECRET,
                  DASHBOARD_SESSION_SECRET: env.DASHBOARD_SESSION_SECRET,
                  DASHBOARD_ENCRYPTION_KEY: env.DASHBOARD_ENCRYPTION_KEY}' \
            | bunx wrangler secret bulk

      - name: Write optional ALERT_WEBHOOK_URL secret
        if: env.ALERT_WEBHOOK_URL != ''
        run: "jq -n '{ALERT_WEBHOOK_URL: env.ALERT_WEBHOOK_URL}' | bunx wrangler secret bulk"

      - name: Remove ALERT_WEBHOOK_URL secret (unset = log-only)
        if: env.ALERT_WEBHOOK_URL == ''
        run: "jq -n '{ALERT_WEBHOOK_URL: null}' | bunx wrangler secret bulk"

      - name: Deploy Worker
        id: deploy
        shell: bash
        env:
          TENANT_MODE: ${{ steps.tenant.outputs.mode }}
        run: |
          # ADMIN_LOGINS comes from the GitHub Actions variable and is injected
          # here as a plain Worker var (`--var NAME:VALUE`, wrangler 4.147.0
          # splits on the FIRST colon only, so a comma-separated login list
          # survives intact). keep_vars: true in wrangler.jsonc still preserves
          # the other dashboard-managed var (REVIEW_ENABLED).
          # WORKSPACE_TENANT_MODE is the dispatch input resolved above — the
          # same SHA can be replayed with the other mode.
          bunx wrangler deploy --var "ADMIN_LOGINS:$ADMIN_LOGINS" --var "WORKSPACE_TENANT_MODE:$TENANT_MODE" 2>&1 | tee deploy.log
          # The deploy command succeeded: this run's SHA is what it shipped.
          # The summary key is derived from this step's outcome in the
          # always-run summary step, never from the version-id capture below.
          echo "deployed_sha=$GITHUB_SHA"

      # Capture only. `wrangler deploy` already returned success, so a log-shape
      # problem must not flip the run to "not deployed": the marker is recorded
      # and the step is allowed to fail.
      - name: Capture Worker version id
        continue-on-error: true
        run: |
          grep -oE 'Current Version ID: .+' deploy.log | tail -1 | cut -d' ' -f4 > version_id.txt || true
          if ! test -s version_id.txt; then
            echo "unreported" > version_id.txt
            echo "::warning::wrangler deploy reported no Worker version id in deploy.log — recorded version_id=unreported"
          fi

      - name: "Smoke: healthz"
        run: |
          ok=0
          for _ in 1 2 3; do
            if curl -sf --max-time 30 --connect-timeout 5 https://mstar-inspector.42ch.dev/healthz >/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1

      - name: "Smoke: cron registration"
        run: 'grep -F "schedule: */15 * * * *" deploy.log'

      - name: "Smoke: image digest"
        run: |
          set -euo pipefail
          # Sandbox SDK 1.0 (durable_object policy). The digest comes from the
          # `wrangler deploy` STDOUT already captured in deploy.log by
          # `tee deploy.log`: the container summary block prints the resolved
          # reference twice, on the "Preparing sandbox for Cloudflare
          # Containers" and "sandbox is ready to run" lines —
          #   registry.cloudflare.com/<account>/<repo>@sha256:<64hex>
          # `wrangler containers list --json` is NOT usable for this app: the
          # durable_object application record carries no usable image (the real
          # deploy shows `"image": ""` for mstar-inspector-sandbox-v2 and no
          # `.configuration.image` field) — the `image` shape belongs to the
          # default-policy app `mstar-inspector-sandbox`, orphaned by the 1.0
          # cutover. A second source would add an API call + token permission
          # and an equality branch for no gain, so the deploy log is the single
          # source; DOCS-01 wants the digest of what this deploy shipped.
          #
          # The registry repo name is wrangler-DERIVED
          # (`<worker>-<class_name lowercase>-sandbox` →
          # mstar-inspector-sandboxv1-sandbox) and is NOT the container
          # application name (mstar-inspector-sandbox-v2); matching on the
          # application name finds nothing — only the Worker prefix
          # (mstar-inspector) is shared by both names.
          : > image_digest.txt   # must exist even on the fail-loud path (upload-artifact if-no-files-found: error)
          grep -oE 'registry\.cloudflare\.com/[^@[:space:]]*mstar-inspector[^@[:space:]]*@sha256:[0-9a-f]{64}' \
            deploy.log | sort -u > digest_refs.txt || true
          grep -oE 'sha256:[0-9a-f]{64}' digest_refs.txt | sort -u > digest_candidates.txt || true
          count=$(wc -l < digest_candidates.txt | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::no image digest for worker mstar-inspector in deploy.log (expected registry.cloudflare.com/<account>/mstar-inspector…@sha256:<64hex>) — log tail follows"
            tail -40 deploy.log
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "::error::$count distinct image digests for worker mstar-inspector in deploy.log — cannot pick a DOCS-01 baseline; raw matches follow"
            cat digest_refs.txt
            exit 1
          fi
          rm -f digest_refs.txt
          mv digest_candidates.txt image_digest.txt
          test -s image_digest.txt

      # Post-deploy re-check: the artifact now serving traffic is the one the
      # pre-deploy gate approved; the same question is asked against it.
      - name: Assert zero orphan Apps (post-deploy)
        run: bun scripts/assert-tenant-attribution.ts --db mstar-inspector-db

      # ADMIN_LOGINS is a plain Worker var injected by this workflow's
      # `wrangler deploy --var ADMIN_LOGINS:…` (login names are public
      # identity, hence a variable, not a secret). `wrangler secret list`
      # cannot observe it, so read the Worker settings instead; the observed
      # value is fed through the RUNTIME parser itself (parseAdminLogins in
      # src/dashboard/users.ts) rather than a shell approximation of it. This
      # is an ASSERTION: the deploy is already live (containers/versions have
      # no pre-flight dry run), so a missing/blank value must fail the run red
      # rather than warn.
      - name: "Assert ADMIN_LOGINS is set on the deployed Worker (first-login admin fallback)"
        run: |
          # Transport failure (no payload at all) FAILS the job: we cannot
          # positively confirm the value, and a silent pass here would turn a
          # flaky API read into a false green for exactly the check that guards
          # the first-login-becomes-admin fallback.
          settings=$(curl -sf --max-time 30 --connect-timeout 5 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/mstar-inspector/settings") || {
            echo "::error::could not read the deployed Worker settings (transport failure) — cannot confirm ADMIN_LOGINS; re-run the workflow"
            exit 1
          }
          # A 200 with a malformed / non-success body is NOT a positively
          # observed set: never read a parse failure as a configured value.
          if ! printf '%s' "$settings" | jq -e '.success == true' >/dev/null 2>&1; then
            echo "::error::deployed Worker settings payload failed the jq success check (malformed JSON or success != true) — cannot confirm ADMIN_LOGINS"
            exit 1
          fi
          value=$(printf '%s' "$settings" \
            | jq -r '[.result.bindings[]? | select(.name == "ADMIN_LOGINS") | if .type == "secret_text" then "set" else (.text // "") end] | join("")')
          ADMIN_LOGINS_DEPLOYED="$value" bun -e '
            import { parseAdminLogins } from "./src/dashboard/users.ts";
            if (parseAdminLogins(process.env.ADMIN_LOGINS_DEPLOYED).length === 0) {
              console.error("::error::ADMIN_LOGINS is unset or blank/whitespace-only/comma-only on the deployed Worker — set the GitHub Actions variable ADMIN_LOGINS (comma-separated GitHub logins) and re-run the deploy; with an empty dashboard_users table the first OAuth login would become admin (self-disarming once any user row exists). See docs/deploy.md § 6.");
              process.exit(1);
            }
          '
          echo "ADMIN_LOGINS is set on the deployed Worker — the first-login admin fallback is disarmed"

      - name: Upload deploy evidence artifacts
        uses: actions/upload-artifact@v7
        with:
          name: deploy-evidence
          path: |
            deploy.log
            version_id.txt
            image_digest.txt
          if-no-files-found: error
        if: always()   # keep per-run evidence even when a later step fails

      - name: Record image digest (DOCS-01 baseline)
        env:
          TENANT_MODE: ${{ steps.tenant.outputs.mode }}
          EXPECTED_DIGEST: ${{ inputs.expected_container_digest }}
        run: |
          set -euo pipefail
          DIGEST=$(cat image_digest.txt)
          # The capture step always leaves a marker (`unreported` on a log-shape
          # problem), so this evidence step never fails on it.
          VERSION=$(cat version_id.txt 2>/dev/null || echo unreported)
          {
            echo "## Deploy evidence (DOCS-01 baseline)"
            echo "- Image digest: \`$DIGEST\`"
            echo "version_id=$VERSION"
            echo "- Tenant mode: \`$TENANT_MODE\`"
            echo "- Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Source: \`registry.cloudflare.com\` container reference printed by this run's \`wrangler deploy\` — \`wrangler containers list --json\` reports an empty \`image\` for the 1.0 durable_object application"
          } >> "$GITHUB_STEP_SUMMARY"
          # Replay audit, never a silent pass: the sandbox image rebuilds from a
          # rolling apt base, so byte-identical output is not provable. A
          # different digest is reported (and warned) with that reason.
          if [ -z "$EXPECTED_DIGEST" ]; then
            MATCH="unreported (no expected_container_digest input)"
          elif [ "$DIGEST" = "$EXPECTED_DIGEST" ]; then
            MATCH=true
          else
            MATCH=false
            echo "::warning::container digest $DIGEST differs from Deploy A's $EXPECTED_DIGEST — the sandbox image rebuilds from a rolling base, so a byte-identical rebuild is not provable; the Worker code is the same SHA"
          fi
          echo "container_digest_match=$MATCH" >> "$GITHUB_STEP_SUMMARY"
          echo "container_digest_match=$MATCH"
          echo "::notice::DOCS-01 baseline: digest=$DIGEST version=$VERSION (run summary + deploy-evidence artifact)"

      # The ONE place the summary decides status, and the decision is made by
      # scripts/deploy-status.sh (behaviour-tested): success emits
      # deploy_status=deployed + deployed_sha, anything else emits
      # deploy_status=not-deployed + requested_sha, never both. The version-id
      # capture is deliberately not consulted for that decision.
      - name: Record deploy status
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          RUN_SHA: ${{ github.sha }}
        run: |
          bash scripts/deploy-status.sh "$DEPLOY_OUTCOME" "$RUN_SHA" "$RUN_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "version_id=$(cat version_id.txt 2>/dev/null || echo unreported)" >> "$GITHUB_STEP_SUMMARY"
