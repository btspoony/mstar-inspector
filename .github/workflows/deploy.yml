name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '.mstar/**', '*.md', 'LICENSE', '.env.example']
  workflow_dispatch: {}

concurrency:
  group: deploy-mstar-inspector
  cancel-in-progress: false

jobs:
  test:
    permissions: { contents: read }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions: { contents: read, actions: write }   # actions: write — gh variable set (DOCS-01 baseline); no git push anymore
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}   # account id is public — configured as a variable
      OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}   # client id is not sensitive — configured as a variable
      OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
      DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
      DASHBOARD_ENCRYPTION_KEY: ${{ secrets.DASHBOARD_ENCRYPTION_KEY }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Bugbot #14: digest write-back merges origin/main — shallow clone has no merge base

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Cloudflare account
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"   # account id is a variable — must be configured
          bunx wrangler whoami    # token/账户名佐证，输出进 run log（人工核对账户）

      - name: Write required secrets
        run: |
          : "${OAUTH_CLIENT_ID:?required}" "${OAUTH_CLIENT_SECRET:?required}" \
            "${DASHBOARD_SESSION_SECRET:?required}" "${DASHBOARD_ENCRYPTION_KEY:?required}"
          jq -n '{GITHUB_OAUTH_CLIENT_ID: env.OAUTH_CLIENT_ID,
                  GITHUB_OAUTH_CLIENT_SECRET: env.OAUTH_CLIENT_SECRET,
                  DASHBOARD_SESSION_SECRET: env.DASHBOARD_SESSION_SECRET,
                  DASHBOARD_ENCRYPTION_KEY: env.DASHBOARD_ENCRYPTION_KEY}' \
            | bunx wrangler secret bulk

      - name: Write optional ALERT_WEBHOOK_URL secret
        if: env.ALERT_WEBHOOK_URL != ''
        run: "jq -n '{ALERT_WEBHOOK_URL: env.ALERT_WEBHOOK_URL}' | bunx wrangler secret bulk"

      - name: Remove ALERT_WEBHOOK_URL secret (unset = log-only)
        if: env.ALERT_WEBHOOK_URL == ''
        run: "jq -n '{ALERT_WEBHOOK_URL: null}' | bunx wrangler secret bulk"

      - name: Apply D1 migrations (remote)
        run: bunx wrangler d1 migrations apply mstar-inspector-db --remote

      - name: Deploy Worker
        shell: bash
        run: |
          bunx wrangler deploy 2>&1 | tee deploy.log
          grep -oE 'Current Version ID: .+' deploy.log | tail -1 | cut -d' ' -f4 > version_id.txt
          test -s version_id.txt

      - name: "Smoke: healthz"
        run: |
          ok=0
          for _ in 1 2 3; do
            if curl -sf https://mstar-inspector.42ch.dev/healthz >/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1

      - name: "Smoke: cron registration"
        run: 'grep -F "schedule: */15 * * * *" deploy.log'

      - name: "Smoke: image digest"
        run: |
          bunx wrangler containers list --json \
            | jq -r '.[] | select(.name == "mstar-inspector-sandbox") | .image' \
            | grep -oE 'sha256:[0-9a-f]{64}' > image_digest.txt
          test -s image_digest.txt
          # 备源（首次实跑若 .name 与预期不符，以部署日志锚定行兜底）：
          # grep -oE "registry\.cloudflare\.com/${CLOUDFLARE_ACCOUNT_ID}/mstar-inspector-sandbox@sha256:[0-9a-f]{64}" deploy.log

      - name: Upload deploy evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-evidence
          path: |
            deploy.log
            version_id.txt
            image_digest.txt
          if-no-files-found: error
        if: always()   # keep per-run evidence even when a later step fails

      - name: Record live image digest (DOCS-01 baseline)
        env:
          GH_TOKEN: ${{ github.token }}   # gh CLI does not auto-inject GITHUB_TOKEN — must pass explicitly (Bugbot #18)
        run: |
          set -euo pipefail
          DIGEST=$(cat image_digest.txt); VERSION=$(cat version_id.txt)
          gh variable set LIVE_IMAGE_DIGEST --body "$DIGEST"
          gh variable set LIVE_WORKER_VERSION --body "$VERSION"
          echo "::notice::DOCS-01 baseline recorded: digest=$DIGEST version=$VERSION (compare against 'wrangler containers list' live state)"
