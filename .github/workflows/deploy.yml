name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '.mstar/**', '*.md', 'LICENSE']
  workflow_dispatch: {}

concurrency:
  group: deploy-mstar-inspector
  cancel-in-progress: false

jobs:
  test:
    permissions: { contents: read }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  deploy:
    needs: test
    permissions: { contents: write }
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
      GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}
      DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
      DASHBOARD_ENCRYPTION_KEY: ${{ secrets.DASHBOARD_ENCRYPTION_KEY }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Cloudflare account
        run: |
          test "$CLOUDFLARE_ACCOUNT_ID" = "f68fcd78e7c5c10f0466788bb9e85b8e"   # stale env 即 trap
          bunx wrangler whoami    # token/账户名佐证，输出进 run log

      # (T2) secrets 注入：wrangler secret bulk 四件套 + ALERT_WEBHOOK_URL 条件步
      # (T3) D1 迁移 --remote + wrangler deploy + post-deploy smoke（healthz / cron / digest 提取）
      # (T4) digest 写回 docs/deploy.md（git commit + push；paths-ignore 防递归）
