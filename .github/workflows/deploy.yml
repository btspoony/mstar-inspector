name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '.mstar/**', '*.md', 'LICENSE', '.env.example']
  workflow_dispatch: {}

concurrency:
  group: deploy-mstar-inspector
  cancel-in-progress: false

jobs:
  test:
    permissions: { contents: read }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions: { contents: write }
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
      GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}
      DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
      DASHBOARD_ENCRYPTION_KEY: ${{ secrets.DASHBOARD_ENCRYPTION_KEY }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Cloudflare account
        run: |
          test -n "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"   # repo var must declare the deploy account
          test "$CLOUDFLARE_ACCOUNT_ID" = "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"   # stale env 即 trap
          bunx wrangler whoami    # token/账户名佐证，输出进 run log

      - name: Write required secrets
        run: |
          : "${GITHUB_OAUTH_CLIENT_ID:?required}" "${GITHUB_OAUTH_CLIENT_SECRET:?required}" \
            "${DASHBOARD_SESSION_SECRET:?required}" "${DASHBOARD_ENCRYPTION_KEY:?required}"
          jq -n '{GITHUB_OAUTH_CLIENT_ID: env.GITHUB_OAUTH_CLIENT_ID,
                  GITHUB_OAUTH_CLIENT_SECRET: env.GITHUB_OAUTH_CLIENT_SECRET,
                  DASHBOARD_SESSION_SECRET: env.DASHBOARD_SESSION_SECRET,
                  DASHBOARD_ENCRYPTION_KEY: env.DASHBOARD_ENCRYPTION_KEY}' \
            | bunx wrangler secret bulk

      - name: Write optional ALERT_WEBHOOK_URL secret
        if: env.ALERT_WEBHOOK_URL != ''
        run: "jq -n '{ALERT_WEBHOOK_URL: env.ALERT_WEBHOOK_URL}' | bunx wrangler secret bulk"

      - name: Remove ALERT_WEBHOOK_URL secret (unset = log-only)
        if: env.ALERT_WEBHOOK_URL == ''
        run: "jq -n '{ALERT_WEBHOOK_URL: null}' | bunx wrangler secret bulk"

      - name: Apply D1 migrations (remote)
        run: bunx wrangler d1 migrations apply mstar-inspector-db --remote

      - name: Deploy Worker
        shell: bash
        run: |
          bunx wrangler deploy 2>&1 | tee deploy.log
          grep -oE 'Current Version ID: .+' deploy.log | tail -1 | cut -d' ' -f4 > version_id.txt
          test -s version_id.txt

      - name: "Smoke: healthz"
        run: |
          ok=0
          for _ in 1 2 3; do
            if curl -sf https://mstar-inspector.42ch.dev/healthz >/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1

      - name: "Smoke: cron registration"
        run: 'grep -F "schedule: */15 * * * *" deploy.log'

      - name: "Smoke: image digest"
        run: |
          bunx wrangler containers list --json \
            | jq -r '.[] | select(.name == "mstar-inspector-sandbox") | .image' \
            | grep -oE 'sha256:[0-9a-f]{64}' > image_digest.txt
          test -s image_digest.txt
          # 备源（首次实跑若 .name 与预期不符，以部署日志锚定行兜底）：
          # grep -oE "registry\.cloudflare\.com/${CLOUDFLARE_ACCOUNT_ID}/mstar-inspector-sandbox@sha256:[0-9a-f]{64}" deploy.log

      - name: Record image digest in docs/deploy.md
        run: |
          set -euo pipefail
          git fetch origin main && git merge --no-edit origin/main   # 先合并：串行部署保证 delta 仅先前 record commit（docs-only）；此时工作树干净，merge 不会因本地改动 abort
          DIGEST=$(cat image_digest.txt); VERSION=$(cat version_id.txt); DATE=$(date -u +%F)
          export DIGEST VERSION DATE   # python3 heredoc reads os.environ
          python3 - <<'EOF'
          import pathlib, os, sys
          p = pathlib.Path("docs/deploy.md"); text = p.read_text()
          start_marker, end_marker = "<!-- deploy-record:start -->", "<!-- deploy-record:end -->"
          if start_marker not in text or end_marker not in text:
              sys.exit("deploy-record markers missing in docs/deploy.md; cannot write record — restore the markers and re-run")
          start, end = text.index(start_marker), text.index(end_marker)
          block = (f"- Image digest: `{os.environ['DIGEST']}`"
                   f"（registry.cloudflare.com/f68fcd78e7c5c10f0466788bb9e85b8e/mstar-inspector-sandbox）\n"
                   f"- Deploy date: {os.environ['DATE']}（Worker version `{os.environ['VERSION']}` — "
                   f"Actions run {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}）\n")
          p.write_text(text[:start+len(start_marker)] + "\n" + block + text[end:])
          EOF
          git diff --quiet -- docs/deploy.md && { echo "record unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deploy.md
          git commit -m "chore(deploy): record image digest ${DIGEST:7:12}"
          if ! git push origin main; then
            echo "::error::Deploy succeeded but digest record push failed; paste the digest into docs/deploy.md manually per § Image pins and digest record"
            exit 1
          fi
