name: Release prep

# The cut-a-release entry point. Trigger manually from Actions → "Release prep"
# → Run workflow (optionally pass an explicit X.Y.Z; leave empty for an auto
# patch bump from package.json#version). It assembles changelog fragments,
# bumps the version surface, validates, typechecks + builds, pushes the
# `release/vX.Y.Z` branch, and opens / updates the `release vX.Y.Z` PR.
# Merging that PR runs the Release workflow (tag + bilingual GitHub Release)
# and the Deploy workflow (the human-attributed main push deploys as usual).
#
# AD-5 (GITHUB_TOKEN event suppression): release PRs opened by this bot do
# NOT trigger ci.yml. The validate + typecheck + build steps below ARE the
# release PR's verification face; the Release workflow re-verifies on the
# merge commit before tagging. A missing checks tab on the release PR is
# expected behavior, not an anomaly (see docs/release.md).
#
# Action pin convention: actions NEW to this repo are SHA-pinned
# (softprops/action-gh-release in release.yml); actions already used by
# ci.yml/deploy.yml (actions/checkout, oven-sh/setup-bun) keep the repo's
# tag-pin convention.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target version (e.g. 1.0.0, or a prerelease like 1.1.0-alpha.0). Leave empty for an auto patch bump."
        required: false
        type: string

permissions:
  contents: write        # push the release/vX branch
  pull-requests: write   # open / update the release PR (no issues:write — no label step, AD-4)

concurrency:
  group: release-prep
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tag-existence check needs released tags

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Reject already-released version
        id: want
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="${INPUT_VERSION}"
          if [ -z "$V" ]; then V="auto"; fi
          if [ "$V" != "auto" ] && git rev-parse "v$V" >/dev/null 2>&1; then
            echo "::error::Tag v$V already exists."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Assemble fragments + bump version surface
        env:
          WANT_VERSION: ${{ steps.want.outputs.version }}
        run: |
          V="${WANT_VERSION}"
          if [ "$V" = "auto" ]; then
            bun run release:prepare -- --patch
          else
            bun run release:prepare -- "$V"
          fi

      - name: Resolve resulting version
        id: ver
        run: |
          VERSION="$(jq -er .version package.json)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bun run release:validate -- "v${VERSION}"

      - name: Typecheck + build SPA (release sanity)
        run: |
          bun run typecheck
          bun run build:spa

      - name: Extract release notes (EN)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bun run scripts/extract-changelog-section.ts "${VERSION}" > "${RUNNER_TEMP}/notes-en.md"

      - name: Commit prepared release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="release/v${VERSION}"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(release): prepare v${VERSION}"
          git push --force-with-lease origin "$BRANCH"

      - name: Open or update release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          BRANCH="release/v${VERSION}"
          TITLE="release v${VERSION}"
          {
            echo "Generated by the **Release prep** workflow."
            echo
            echo "Merging this PR tags v${VERSION} on the merge commit, creates the bilingual GitHub Release, and deploys to staging via the post-merge main push (Deploy workflow)."
            echo
            echo "## Changelog"
            echo
            cat "${RUNNER_TEMP}/notes-en.md"
          } > "${RUNNER_TEMP}/pr-body.md"
          OPEN=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh pr edit "$OPEN" --title "$TITLE" --body-file "${RUNNER_TEMP}/pr-body.md"
            echo "Updated existing release PR #$OPEN"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "${RUNNER_TEMP}/pr-body.md"
          fi
