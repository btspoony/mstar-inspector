name: Release

# PR-driven release. Merging a `release vX.Y.Z` PR (opened by the Release prep
# workflow) runs the whole release inline on the pull_request closed event:
# validate → typecheck + test + build → annotated tag on the merge commit →
# bilingual GitHub Release. Deploying stays fully decoupled — the same merge
# triggers the Deploy workflow through the ordinary (human-attributed) main
# push; this workflow never deploys.
#
# AD-5 (GITHUB_TOKEN event suppression): release PRs opened by the bot do not
# run ci.yml, so the Release prep workflow's validate/typecheck/build steps
# are that PR's verification face — and this workflow re-verifies everything
# on the merge commit before tagging (double insurance).
#
# Prereleases: a version containing `-` (e.g. 1.1.0-alpha.0) creates the
# GitHub Release flagged as a prerelease.
#
# No secrets are required (the tag and the Release are created with the
# workflow's GITHUB_TOKEN).
#
# Deploy-evidence reconciliation: after the Release is created, one
# step dispatches the production Deploy workflow on the release tag
# (GITHUB_TOKEN-created Releases cannot trigger `release: published`), then a
# second step rebuilds the body from the workspace notes file plus a
# deploy-evidence section and rewrites the Release with a single idempotent
# `gh release edit --notes-file` (AD-3 — no live read-modify-write). The
# section records the Worker Version ID + image digest + run link of the
# production Deploy run (`deploy-prod.yml`) for the merge commit, or states
# its absence explicitly. Evidence is a recording surface, never a gate: it
# can neither postpone the tag nor fail this workflow.
#
# Action pin convention: actions NEW to this repo are SHA-pinned
# (softprops/action-gh-release below, byte-identical to the sibling repo);
# actions already used by ci.yml/deploy.yml (actions/checkout,
# oven-sh/setup-bun) keep the repo's tag-pin convention.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write   # push the tag + create the GitHub Release (no id-token:write — no npm publish, AD-4)
  actions: write    # dispatch deploy-prod.yml (`gh workflow run`) + `gh run list`/`gh run download` for the deploy-evidence artifact

jobs:
  release:
    if: >
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.title, 'release v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0   # tag idempotence check needs existing tags

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve version
        id: ver
        run: |
          VERSION="$(jq -er .version package.json)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bun run release:validate -- "v${VERSION}"

      - name: Typecheck + test + build
        run: |
          bun run typecheck
          bun test
          bun run build:spa

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create + push tag (idempotent)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping tag creation."
            exit 0
          fi
          git tag -a -m "Release ${TAG}" "$TAG"
          git push origin "$TAG"

      # Notes composition contract: EN section, blank
      # line, `---`, blank line, CN section. The deploy-evidence step appends its
      # section after this step with the same separator, rebuilding
      # the body from this $RUNNER_TEMP file and rewriting the Release with a
      # single `gh release edit --notes-file` — tag/Release creation never
      # waits for evidence.
      - name: Extract bilingual release notes
        id: changelog
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          NOTES_FILE="${RUNNER_TEMP}/release-notes-${VERSION}.md"
          # extract emits the trimmed body with no trailing newline, so the
          # separator needs \n\n to produce: EN, blank line, ---, blank line, CN.
          {
            bun run scripts/extract-changelog-section.ts "${VERSION}" --lang en
            printf '\n\n---\n\n'
            bun run scripts/extract-changelog-section.ts "${VERSION}" --lang cn
          } > "$NOTES_FILE"
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}

      # A Release created with the workflow `GITHUB_TOKEN` does NOT trigger a
      # `release: published` workflow (documented token-event suppression), so
      # the production workflow must be dispatched explicitly. A rerun of THIS
      # workflow (the documented recovery path after an evidence failure or a
      # timeout) must not queue a SECOND approval-gated deploy: the step first
      # looks for an existing `deploy-prod.yml` run OF THIS TAG for the release
      # commit and reuses it (notice, no dispatch) — the collector resolves the
      # production run for the tag, so a duplicate would make the evidence wait
      # on the new run instead of backfilling the already-completed one. The
      # lookup applies the collector's own identity rule — the run's headBranch
      # IS the tag — so a run for ANOTHER tag on the same commit (a rollback)
      # is not this release's deploy: it is never reused, and it cannot hide a
      # reusable same-tag run listed behind it. Reuse applies only
      # to an in-flight run (waiting for approval, or otherwise not concluded) or
      # one that succeeded; ANY other terminal outcome (failure, cancelled,
      # timed_out, startup_failure, action_required, stale, neutral, skipped)
      # dispatches a fresh run, so a rerun after a failed deploy retries — and
      # the highest run id it observed on the WHOLE page (any ref) before
      # dispatching is
      # handed to the evidence step (the `since_run` output, run ids increase
      # monotonically) so the collector resolves the run this dispatch queued
      # rather than an older success or a foreign tag's completed run. This
      # step runs
      # AFTER the Release (a dispatch failure leaves tag + Release in place and
      # converges on re-run) and BEFORE the evidence step, whose bounded wait
      # must be able to see the run. The tag is passed as `--ref`
      # only: deploy-prod.yml has no `ref` input, so the run deploys exactly the
      # ref it runs on (its own guard refuses a non-tag ref) — the collector
      # matches runs by `--commit <merge sha>` and the run's headBranch is the
      # tag.
      #
      # A dispatch always deploys (deploy-prod.yml's guard), so a prerelease
      # must not dispatch at all: same `-` test as the Create step's
      # `prerelease:` flag above, keeping the accepted "prereleases never reach
      # production" contract with deploy-prod.yml untouched.
      - name: Dispatch production deploy on the release tag
        id: dispatch
        if: ${{ !contains(steps.ver.outputs.version, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          SHA="$(git rev-list -n1 "$TAG")"
          # Rerun convergence: never queue a second production run for a commit
          # AND tag that already has one. The lookup emits "<id> <status>
          # <conclusion>" (conclusion `-` while a run is in flight) for the
          # newest run whose own branch is THIS tag, and nothing when the tag
          # has no run. It matches on headBranch — the collector's identity
          # rule: deploy-prod.yml deploys exactly the ref it runs on, so a run
          # for another tag on the same commit is not this release's deploy and
          # must neither be reused nor mask a same-tag run listed behind it
          # (hence the whole page, never a single newest run). The assignment
          # form keeps a lookup failure loud under `set -e` (a failed lookup
          # must not be mistaken for "no run").
          #
          # `--limit 100` is deliberate, not the 20-row default: this ONE call
          # feeds BOTH decisions below, and it must see a reusable run of this
          # tag that can sit behind many newer runs of OTHER tags for the same
          # commit (a commit that has been rolled back to repeatedly accumulates
          # them) — a hidden same-tag run would leave the lookup empty and queue
          # a duplicate production deploy, reapplying forward-only migrations
          # and rewriting secrets. `gh` returns runs NEWEST-FIRST, so
          # `max(databaseId)` over the page is the newest run id for the commit
          # even if the page were ever truncated; the page size is what protects
          # the reuse decision, and 100 is far above any plausible count of
          # production runs for one commit.
          RUNS_JSON="$(gh run list --workflow deploy-prod.yml --commit "$SHA" \
            --limit 100 --json status,conclusion,databaseId,headBranch)"
          LOOKUP="$(printf '%s' "$RUNS_JSON" \
            | jq -r --arg tag "$TAG" 'first(.[] | select(.headBranch == $tag)) // empty | "\(.databaseId) \(.status) \(.conclusion // "-")"')"
          REUSE_ID=""
          REUSE_STATUS=""
          REUSE_CONCLUSION=""
          read -r REUSE_ID REUSE_STATUS REUSE_CONCLUSION <<<"$LOOKUP"

          # Evidence boundary — deliberately WIDER than the reuse lookup above:
          # the highest run id in the whole page, ANY ref. Run ids increase
          # monotonically, so the run `gh workflow run` is about to queue is
          # newer than it, while nothing already visible for the COMMIT may be
          # backfilled as this release's evidence — an OLDER success on this
          # tag is what a single-id exclusion let slip through, and a completed
          # run for ANOTHER tag on the same commit (the rollback alias: this
          # tag's first deploy, the commit already deployed under another tag)
          # would otherwise be cited as this release's deploy. The two scopes
          # differ on purpose: only a same-tag run may ever be REUSED, but any
          # pre-dispatch run must be excluded. Empty when the commit has no run
          # at all; the evidence step then passes no boundary.
          BOUNDARY="$(printf '%s' "$RUNS_JSON" \
            | jq -r 'map(.databaseId) | max // empty')"

          # Reuse ONLY an in-flight run (status != completed, which includes the
          # approval-waiting `waiting` state) or one that actually succeeded.
          # Every other terminal conclusion (failure, cancelled, timed_out,
          # startup_failure, action_required, stale, neutral, skipped) dispatches
          # a fresh run — otherwise a rerun could never recover production.
          if [ -n "$REUSE_ID" ] && { [ "$REUSE_STATUS" != "completed" ] || [ "$REUSE_CONCLUSION" = "success" ]; }; then
            echo "::notice::reusing existing deploy-prod.yml run ${REUSE_ID} for ${TAG} (${SHA}) — status ${REUSE_STATUS}, conclusion ${REUSE_CONCLUSION}; no new deploy queued"
            exit 0
          fi

          if [ -n "$REUSE_ID" ]; then
            echo "::notice::newest deploy-prod.yml run ${REUSE_ID} for ${TAG} concluded ${REUSE_CONCLUSION}; dispatching a fresh deploy"
          fi
          # Whatever is visible now is superseded by the dispatch below: the
          # evidence step forwards the boundary so the collector resolves only
          # the run this dispatch is queuing.
          echo "since_run=${BOUNDARY}" >> "$GITHUB_OUTPUT"
          gh workflow run deploy-prod.yml --ref "$TAG"

      # Evidence append (AD-3): rebuild the complete body in the workspace — the
      # bilingual notes file above, this `---` separator (same form as the
      # EN/CN one), then the collector's section — and rewrite the Release
      # once. Never read-modify-write the live body.
      #
      # This step must not be able to fail the release (evidence is a
      # recording surface, never a gate): the collector exits 0 for every
      # outcome by design, and continue-on-error absorbs everything else —
      # a `gh release edit` failure echoes ::error and exits 1, so the STEP
      # goes visibly red while the JOB stays green. Re-running the workflow
      # converges by itself: the extract step rebuilds the notes file from
      # scratch and the same-body rewrite is idempotent.
      #
      # Timeout budget (QC W-F001): the step's own `timeout-minutes` bounds
      # the wait so it can never starve the pre-steps of the job's 30-min
      # budget — 15 min (collector's bounded-wait default) + margin for the
      # artifact download + the single `gh release edit` + bun startup
      # = 18 min, leaving ≥12 min for everything above. A prerelease version
      # never pays that wait (see the zero-wait arm below). In the extreme case
      # where slow pre-steps + this budget still hit the job cap, the run
      # goes red without losing the tag/Release; a rerun converges (runbook).
      - name: Append deploy evidence to release notes
        timeout-minutes: 18
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          NOTES_FILE: ${{ steps.changelog.outputs.notes_file }}
          # The highest run id the dispatch step observed for the COMMIT, any
          # ref, before it dispatched (empty when it reused a run, dispatched
          # nothing, or the commit had no run): every id at or below it predates
          # this release's deploy, so the collector must not backfill one of
          # them as evidence — including a foreign tag's completed run.
          SINCE_RUN: ${{ steps.dispatch.outputs.since_run }}
          # The section must cite the PRODUCTION deploy (release-triggered);
          # staging deploys on the same main push, so deploy.yml would be ambiguous here.
          DEPLOY_WORKFLOW: deploy-prod.yml
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          printf '\n\n---\n\n' >> "$NOTES_FILE"
          EXTRA_ARGS=()
          # The dispatch step just queued a fresh run: only a run newer than the
          # boundary it captured may be cited, so an OLDER success on this tag is
          # never backfilled as this release's evidence (the collector keeps
          # polling until a post-boundary run appears).
          if [ -n "$SINCE_RUN" ]; then
            EXTRA_ARGS+=(--since-run "$SINCE_RUN")
          fi
          # A prerelease never dispatches (the dispatch step above is skipped),
          # so the full bounded wait would burn ~15 min to state the same
          # absence: one immediate poll writes the same section now.
          case "$VERSION" in
            *-*) EXTRA_ARGS+=(--wait-minutes 0) ;;
          esac
          # --ref selects the run dispatched on this tag over a manual rollback
          # run that merely shares the merge commit (T3-3); deploy-prod.yml
          # deploys exactly the ref it runs on, so a match proves identity, and
          # a miss falls back to the newest run for the commit and says so.
          bun run scripts/collect-deploy-evidence.ts --workflow "$DEPLOY_WORKFLOW" --ref "$TAG" "${EXTRA_ARGS[@]}" >> "$NOTES_FILE"
          if ! gh release edit "v${VERSION}" --notes-file "$NOTES_FILE"; then
            echo "::error::deploy-evidence append failed — Release notes left without the evidence section; re-run the Release workflow to converge (idempotent)"
            exit 1   # step visibly red; continue-on-error keeps the job green
          fi
