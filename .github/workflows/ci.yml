name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The image gate diffs against a pull request's base commit or a
          # push's previous tip, so the full history is needed.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # `wrangler` hashes `sandbox-image/Dockerfile` alone, so an image input
      # change that skips the `# rebuild:` marker would deploy the Worker while
      # the container keeps the previous build. `deploy.yml` ships on push, so
      # this gate must cover push as well: a pull request diffs against its base
      # commit, a push against `github.event.before` (the ref's previous tip).
      # A branch's first push reports the all-zeros sha, which has nothing to
      # diff against — that is a skip, never a failure. Event values arrive as
      # environment variables, so none of them is spliced into the script text.
      # The gate has no dependency imports, so it runs before the install it
      # can reject: a change the gate fails costs no install. A force-push
      # orphans the push's previous tip; the script recovers a usable base (the
      # orphan fetched from origin, else the merge base with the target branch)
      # and still evaluates the diff.
      - name: Image rebuild gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              echo "no previous commit on $REF_NAME — gate skipped"
              exit 0
            fi
          fi
          bun scripts/check-image-inputs.ts --base "$base" --ref "${BASE_REF:-$REF_NAME}"

      # Bun's install cache is content-addressed, so a restored entry cannot
      # change what a frozen install resolves — it only skips the download, and
      # the runner verify step below reuses the same cache.
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Temporary copy: a runner install inside the tree would nest a
      # packages/runner/node_modules that shadows the root resolution.
      - name: Verify runner lockfile
        run: |
          TMP=$(mktemp -d)
          cp packages/runner/package.json packages/runner/bun.lock "$TMP"
          (cd "$TMP" && bun install --frozen-lockfile)
          rm -rf "$TMP"

      - name: Typecheck
        run: bun run typecheck

      # One entry point for the whole design-system chain: the stylesheet, the
      # fixture, DESIGN.md's frontmatter and the preview page are each compared
      # against the token source. `mstar design-md validate .` is local only —
      # the CLI installs from GitHub, which CI must not depend on.
      - name: Design system
        run: bun scripts/design-system-check.ts

      - name: Build SPA
        run: bun run build:spa

      - name: Test
        run: bun test
